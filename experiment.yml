experiments:
  - kind: shell
    name: colmena-experiment-1
    description: colmena-experiment-1
    scripts:
      # Install Redis
      - labels:
          - trigger
          - redis
          - simulation
          - colmena
          - swarm
        script: |
          sudo dnf -y install git
      #- labels:
      #    - trigger
      #  script: |
      #    bin/fabric-l2-network.py
      # Install Redis
      - labels:
          - redis
        script: |
          bin/launch-redis.sh
      # Install Simulation
      - labels:
          - simulation
        script: |
          bin/launch-simulation.sh
      # Install Colmena
      - labels:
          - colmena
        script: |
          bin/launch-colmena.sh
      # Install Swarm
      - labels:
          - swarm
        script: |
          bin/launch-swarm.sh
      # Execute random process
      - labels:
          - random
        script: |
          bin/execute-random.sh
      # Trigger Simulation
      - labels:
          - trigger
        script: |
          bin/build-and-deploy.sh
