name: colmena-experiment

software:
  docker:
    labels:
      - simulation
      - redis
      - colmena
      - swarm
      - trigger

sites:
  - kind: vagrant
    backend: virtualbox
    box: bento/rockylinux-9
    user: vagrant
    config_extra: 'config.vm.synced_folder ".", "/vagrant", disabled: true'
    resources:
      machines:
        - labels:
            - simulation
            - redis
            - wait
          backend: virtualbox
          box: bento/rockylinux-9
          user: vagrant
          config_extra_vm: 'my.vm.synced_folder ".", "/vagrant", disabled: true'
          flavour: "large"
          number: 1
        - labels:
            - colmena
            - swarm
            - trigger
            - random
            - kpis
          backend: virtualbox
          box: bento/rockylinux-9
          user: vagrant
          config_extra_vm: 'my.vm.synced_folder ".", "/vagrant", disabled: true'
          flavour: "large"
          number: 1
        - labels:
            - colmena
            - swarm
          backend: virtualbox
          box: bento/rockylinux-9
          user: vagrant
          config_extra_vm: 'my.vm.synced_folder ".", "/vagrant", disabled: true'
          flavour: "large"
          number: 2
      networks:
        - labels:
            - r1
          cidr: "192.168.57.0/24"

  # - kind: fabric
  #   rc_file: secrets/fabric_rc
  #   walltime: "02:00:00"
  #   site: UCSD
  #   image: default_rocky_9
  #   resources:
  #     machines:
  #       - labels:
  #           - central-manager
  #           - submit
  #           - execute
  #           - personal
  #         flavour: big
  #         number: 1

experiments:
  - kind: shell
    name: colmena-experiment-1
    description: colmena-experiment-1
    scripts:
      # Install Redis
      - labels:
          - trigger
          - redis
          - simulation
          - colmena
          - swarm
          - wait
          - kpis
        script: |
          sudo dnf -y install git
      #- labels:
      #    - trigger
      #  script: |
      #    bin/fabric-l2-network.py
      # Install Redis
      - labels:
          - redis
        script: |
          bin/docker-login.sh xaviercasasbsc
          bin/launch-redis.sh
      # Install Simulation
      - labels:
          - simulation
        # Host names should be included previously, this is a temporal solution
        script: |
          grep -qE '(^|\s)andes(\s|$)' /etc/hosts || echo "192.168.157.245 andes" | sudo tee -a /etc/hosts > /dev/null 
          export AGENT_NUM=0
          export AGENT_AREA=0
          bin/launch-simulation.sh example_config/config.py ~/output_plots 
          bin/launch-colmena.sh --hardware SIMULATOR --policy eager --config-path example_config/
      # Install Colmena
      - labels:
          - colmena
        script: |
          bin/docker-login.sh xaviercasasbsc
          bin/pull-images.sh xaviercasasbsc/distributed_mpc:0.1 xaviercasasbsc/monitoringrole:0.1 xaviercasasbsc/simulationmanager:0.1
          grep -qE '(^|\s)andes(\s|$)' /etc/hosts || echo "192.168.157.245 andes" | sudo tee -a /etc/hosts > /dev/null
          export AGENT_NUM=1
          export AGENT_AREA=1
          bin/launch-colmena.sh --hardware AREA --policy consensus --config-path example_config/
      # Install Swarm
      - labels:
          - swarm
        script: |
          export AGENT_NUM=1
          grep -qE '(^|\s)andes(\s|$)' /etc/hosts || echo "192.168.57.245 andes" | sudo tee -a /etc/hosts > /dev/null
          bin/launch-swarm.sh 18 3 6 example_config/
      # Execute random process
      - labels:
          - random
        script: |
          bin/execute-random.sh
      # Trigger Simulation
      - labels:
          - trigger
        script: |
          export AGENT_NUM=1
          export AGENT_AREA=1
          cat secrets/docker_token.txt | docker login -u xaviercasasbsc --password-stdin
          bin/build-images.sh example_config/ xaviercasasbsc
          bin/deploy.sh example_config/ xaviercasasbsc AgentControl
      - labels:
          - wait
        scripts:
          bin/wait-for-simulation.sh
      - labels:
          - kpis
        scripts:
          bin/fetch-kpi-timeline.sh
    outputs:
      - labels:
          - simulation
        src: output_plots/
        dst: output/simulation/
      - labels:
          - trigger
        src: ~/logs.txt
        dst: output/kpi_logs.txt
