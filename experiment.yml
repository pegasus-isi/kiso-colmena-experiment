name: colmena-experiment

sites:
  - kind: fabric
    rc_file: secrets/fabric_rc
    walltime: "02:00:00"
    name_prefix: colmena
    resources:
      machines:
        - labels:
            - colmena
            - swarm
            - random
          site: WASH
          image: docker_ubuntu_22
          flavour_desc:
            core: 1
            mem: 1
            disk: 20
          number: 3
        - labels:
            - colmena
            - swarm
            - random
          site: HAWI
          image: docker_ubuntu_22
          flavour_desc:
            core: 1
            mem: 1
            disk: 20
          number: 3
        - labels:
            - colmena
            - swarm
            - random
          site: UTAH
          image: docker_ubuntu_22
          flavour_desc:
            core: 1
            mem: 1
            disk: 20
          number: 3
        - labels:
            - simulation
            - redis
            - wait
            - trigger
            - kpis
          site: WASH
          image: docker_ubuntu_22
          flavour_desc:
            core: 1
            mem: 1
            disk: 20
          number: 1
      networks:
        - labels:
            - v4
          kind: FABNetv4
          site: WASH
          nic:
            kind: SharedNIC
            model: ConnectX-6
        - labels:
            - v4
          kind: FABNetv4
          site: HAWI
          nic:
            kind: SharedNIC
            model: ConnectX-6
        - labels:
            - v4
          kind: FABNetv4
          site: UTAH
          nic:
            kind: SharedNIC
            model: ConnectX-6

experiments:
  - kind: shell
    name: colmena-experiment-1
    description: colmena-experiment-1
    scripts:
      - labels:
          - colmena
          - simulation
        script: |
          sudo usermod -a -G docker kiso
      - labels:
          - colmena
          - simulation
        script: |
          sudo -n tee -a /etc/hosts < secrets/hosts
          bin/export-agent-vars.sh
      - labels:
          - redis
        script: |
          bin/docker-login.sh xaviercasasbsc
          bin/launch-redis.sh
      - labels:
          - simulation
        script: |
          export AGENT_NUM=0
          export AGENT_AREA=0
          bin/launch-simulation.sh example_config/config.py ~/output_plots
          bin/zenoh-config.sh example_config/agent/zenoh-router/zenohd-config.json5
          bin/launch-colmena.sh --hardware SIMULATOR --policy eager --config-path example_config/
      - labels:
          - colmena
        script: |
          bin/add-andes.sh
          bin/zenoh-config.sh example_config/agent/zenoh-router/zenohd-config.json5
          bin/docker-login.sh xaviercasasbsc
          bin/pull-images.sh xaviercasasbsc/distributed_mpc:0.1 xaviercasasbsc/monitoringrole:0.1 xaviercasasbsc/simulationmanager:0.1
          export AGENT_AREA=$(cat secrets/agent_area)
          export AGENT_NUM=$(cat secrets/agent_num)
          bin/launch-colmena.sh --hardware AREA --policy consensus --config-path example_config/
      - labels:
         - swarm
        script: |
          export AGENT_NUM=$(cat secrets/agent_num)
          bin/launch-swarm.sh 9 3 3 $HOME/kiso-colmena-experiment/example_config
      - labels:
          - random
        script: |
          bin/execute-random.sh
      - labels:
          - trigger
        script: |
          bin/docker-login.sh xaviercasasbsc
          bin/build-images.sh example_config/ xaviercasasbsc
          bin/deploy.sh example_config/ xaviercasasbsc AgentControl
      - labels:
          - wait
        script: |
          bin/wait-for-simulation.sh
      - labels:
          - kpis
        script: |
          bin/fetch-kpi-timeline.sh
    outputs:
      - labels:
          - simulation
        src: output_plots/
        dst: output/simulation/
      - labels:
          - trigger
        src: /home/ubuntu/logs.txt
        dst: output/kpi_logs/
