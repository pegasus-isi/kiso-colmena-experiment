name: colmena-experiment

software:
  docker:
    labels:
      - simulation
      - redis
      - colmena
      - swarm
      - trigger

sites:
  - kind: vagrant
    backend: virtualbox
    box: bento/rockylinux-9
    user: vagrant
    config_extra: 'config.vm.synced_folder ".", "/vagrant", disabled: true'
    resources:
      machines:
        - labels:
            - simulation
            - colmena
            - redis
          backend: virtualbox
          box: bento/rockylinux-9
          user: vagrant
          config_extra_vm: 'my.vm.synced_folder ".", "/vagrant", disabled: true'
          flavour: "large"
          number: 1
        - labels:
            - colmena
            - swarm
            - trigger
            - random
          backend: virtualbox
          box: bento/rockylinux-9
          user: vagrant
          config_extra_vm: 'my.vm.synced_folder ".", "/vagrant", disabled: true'
          flavour: "large"
          number: 1
        #- labels:
        #    - colmena
        #    - swarm
        #  backend: virtualbox
        #  box: bento/rockylinux-9
        #  user: vagrant
         # config_extra_vm: 'my.vm.synced_folder ".", "/vagrant", disabled: true'
        #  flavour: "large"
        #  number: 2
      networks:
        - labels:
            - r1
          cidr: "192.168.57.0/24"

  # - kind: fabric
