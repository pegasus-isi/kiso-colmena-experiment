name: colmena-experiment

sites:
  - kind: fabric
    rc_file: secrets/fabric_rc
    walltime: "02:00:00"
    name_prefix: colmena
    resources:
      machines:
        - labels:
            - colmena
            - consensus
            - random
          site: LOSA
          image: docker_ubuntu_22
          flavour_desc:
            core: 1
            mem: 1
            disk: 20
          number: 3
        - labels:
            - colmena
            - consensus
            - random
          site: HAWI
          image: docker_ubuntu_22
          flavour_desc:
            core: 1
            mem: 1
            disk: 20
          number: 3
        - labels:
            - colmena
            - consensus
            - random
          site: UTAH
          image: docker_ubuntu_22
          flavour_desc:
            core: 1
            mem: 1
            disk: 20
          number: 3
        - labels:
            - simulation
            - redis
            - wait
            - trigger
            - kpis
          site: LOSA
          image: docker_ubuntu_22
          flavour_desc:
            core: 1
            mem: 1
            disk: 20
          number: 1
      networks:
        - labels:
            - v4
          kind: FABNetv4
          site: LOSA
          nic:
            kind: SharedNIC
            model: ConnectX-6
        - labels:
            - v4
          kind: FABNetv4
          site: HAWI
          nic:
            kind: SharedNIC
            model: ConnectX-6
        - labels:
            - v4
          kind: FABNetv4
          site: UTAH
          nic:
            kind: SharedNIC
            model: ConnectX-6

experiments:
  - kind: shell
    name: colmena-experiment-1
    description: colmena-experiment-1
    scripts:
      - labels:
          - colmena
          - simulation
        script: |
          bin/configure.sh
      - labels:
          - redis
        script: |
          bin/launch-redis.sh
      - labels:
          - simulation
        script: |
          bin/launch-simulation.sh example_config/config.py ~/output_plots
          bin/launch-colmena.sh --hardware SIMULATOR --policy eager --config-path example_config/
      - labels:
          - colmena
        script: |
          bin/launch-colmena.sh --hardware AREA --policy consensus --config-path example_config/
      - labels:
         - consensus
        script: |
          bin/launch-swarm.sh 9 3 3 $HOME/kiso-colmena-experiment/example_config
      - labels:
          - random
        script: |
          bin/execute-random.sh
      - labels:
          - trigger
        script: |
          bin/build-images.sh example_config/
          bin/deploy.sh example_config/ AgentControl
      - labels:
          - wait
        script: |
          bin/wait-for-simulation.sh
      - labels:
          - kpis
        script: |
          bin/fetch-kpi-timeline.sh
      - labels:
          - colmena
          - simulation
        script: |
          bin/get-agent-timestamps.sh
          bin/stop-containers.sh
      - labels:
          - consensus
        script: |
          bin/stop-swarm.sh
    
    outputs:
      - labels:
          - simulation
        src: /home/kiso/output_plots
        dst: output/simulation/
      - labels:
          - trigger
        src: /home/kiso/logs_parsed.txt
        dst: output/kpi_logs/
      - labels:
          - colmena
        src: /home/kiso/timestamps/
        dst: output/timestamps/
